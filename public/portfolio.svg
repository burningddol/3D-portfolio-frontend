<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#1084d0"/>
    </linearGradient>
  </defs>

  <!-- Monitor outer body -->
  <rect x="10" y="14" width="80" height="58" fill="#c3c3c3" stroke="#000" stroke-width="2"/>

  <!-- Highlight (top/left) -->
  <rect x="10" y="14" width="80" height="2" fill="#ffffff"/>
  <rect x="10" y="14" width="2" height="58" fill="#ffffff"/>

  <!-- Shadow (bottom/right) -->
  <rect x="10" y="70" width="80" height="2" fill="#808080"/>
  <rect x="88" y="14" width="2" height="58" fill="#808080"/>

  <!-- Screen bezel -->
  <rect x="16" y="20" width="68" height="46" fill="#000" />

  <!-- Screen -->
  <rect x="18" y="22" width="64" height="42" fill="url(#screenGrad)"/>

  <!-- Title bar inside screen -->
  <rect x="18" y="22" width="64" height="6" fill="#000080"/>
  <rect x="18" y="22" width="64" height="2" fill="#1084d0"/>

  <!-- "JS" letters on screen -->
  <g fill="#ffff00" font-family="'Courier New', monospace" font-weight="bold">
    <text x="50" y="50" font-size="20" text-anchor="middle" fill="#ffffff">JS</text>
  </g>

  <!-- Scanline effect (subtle) -->
  <g opacity="0.18" fill="#000">
    <rect x="18" y="30" width="64" height="1"/>
    <rect x="18" y="36" width="64" height="1"/>
    <rect x="18" y="42" width="64" height="1"/>
    <rect x="18" y="48" width="64" height="1"/>
    <rect x="18" y="54" width="64" height="1"/>
    <rect x="18" y="60" width="64" height="1"/>
  </g>

  <!-- Power LED -->
  <rect x="80" y="68" width="3" height="2" fill="#00ff00"/>

  <!-- Monitor stand neck -->
  <rect x="42" y="72" width="16" height="6" fill="#c3c3c3" stroke="#000" stroke-width="2"/>
  <rect x="42" y="72" width="16" height="1" fill="#ffffff"/>
  <rect x="42" y="77" width="16" height="1" fill="#808080"/>

  <!-- Monitor stand base -->
  <rect x="30" y="80" width="40" height="8" fill="#c3c3c3" stroke="#000" stroke-width="2"/>
  <rect x="30" y="80" width="40" height="1" fill="#ffffff"/>
  <rect x="30" y="87" width="40" height="1" fill="#808080"/>
</svg>
